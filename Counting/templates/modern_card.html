<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Roboto', sans-serif;
    }

    .card {
      background: white;
      padding: 100px 200px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      text-align: center;
      transform: rotate(-2deg);
    }

    .content {
      color: #333333;
      font-size: 25vh;
      font-weight: 900;
      margin: 0;
      line-height: 1;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="content">{content}</div>
  </div>
</body>

</html>
