<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .content {
      color: #ffffff;
      font-size: 45vh;
      font-weight: 300;
      margin: 0;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      letter-spacing: -5px;
    }
  </style>
</head>

<body>
  <div class="content">{content}</div>
</body>

</html>
