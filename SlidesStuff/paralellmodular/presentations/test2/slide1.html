<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Pangea: Earth's Ancient Supercontinent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700;900&family=Roboto+Flex:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <style type="text/tailwindcss">
    @layer utilities {
.ppt-slide {
@apply relative w-[1280px] min-h-[720px] mx-auto box-border
}
}
</style>
  <style>
    body {
      font-family: "Roboto Flex", sans-serif;
      background: #0a0a0a
    }

    .title-font {
      font-family: "Source Code Pro", monospace
    }

    .body-font {
      font-family: "Roboto Flex", sans-serif
    }
  </style>
  <style>
    .material-icons {
      width: 1em
    }
  </style>
  <style>
    .material-icons {
      direction: rtl
    }
  </style>
</head>

<body>
  <div class="ppt-slide flex flex-col justify-center items-center h-[720px]" style="background: #162235">
    <div class="absolute top-0 left-0 w-full h-full">
      <img alt="Pangea Supercontinent Map" class="w-full h-full object-cover"
        src="https://sfile.chatglm.cn/images-ppt/949442a1b04a.jpg" />
      <div class="absolute top-0 left-0 w-full h-full" style="background: rgba(22, 34, 53, 0.85)"></div>
    </div>

    <div class="relative z-10 text-center px-20 flex flex-col items-center justify-center">
      <div class="mb-6">
        <i class="material-icons" style="font-size: 72px;
color: #37DCF2">public</i>
      </div>
      <h1 class="title-font text-7xl font-black mb-8 leading-tight tracking-tight" style="color: #FFF">
        PANGEA
      </h1>
      <div class="w-64 h-1 mx-auto mb-8" style="background: #37DCF2"></div>
      <p class="body-font text-2xl font-light tracking-wide mb-4" style="color: #FFF">
        Earth's Ancient Supercontinent
      </p>
      <p class="body-font text-xl font-light tracking-wide" style="color: rgba(255, 255, 255, 0.7)">
        299 - 180 Million Years Ago
      </p>
    </div>

    <div class="absolute bottom-0 left-0 right-0 z-10 h-24 flex items-center justify-center"
      style="background: linear-gradient(to top, rgba(22, 34, 53, 0.95), transparent)">
      <div class="body-font text-base" style="color: rgba(255, 255, 255, 0.6)">
        A Journey Through Earth's Geological History
      </div>
    </div>
  </div>
</body>

</html>
