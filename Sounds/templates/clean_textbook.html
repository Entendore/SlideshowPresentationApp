<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide</title>
  <style>
    body {
      background-color: #f0f2f5;
      /* Light Gray Background */
      color: #333333;
      font-family: 'Georgia', 'Times New Roman', serif;
      /* Serif font for a book feel */
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .paper {
      background-color: #ffffff;
      width: 80%;
      max-width: 1000px;
      padding: 60px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    /* Make the words bold and slightly larger */
    strong {
      font-weight: 700;
      color: #000;
    }
  </style>
</head>

<body>
  <div class="paper">
    {content}
  </div>
</body>

</html>
