<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide</title>
  <style>
    body {
      /* Blue Gradient Background */
      background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .content-wrapper {
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      padding: 40px;
    }

    /* Override inline IPA color to be lighter on this dark background */
    span[style*="color: #888"] {
      color: #e0e0e0 !important;
      font-weight: 300;
    }

    strong {
      font-weight: 800;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <div class="content-wrapper">
    {content}
  </div>
</body>

</html>
